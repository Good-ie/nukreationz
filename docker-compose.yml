version: '3.8'

services:
  app:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USERNAME=nukreationz_user
      - DB_PASSWORD=Goodie321Strong!
      - DB_NAME=nukreationz
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=nukreationz
      - MYSQL_USER=nukreationz_user
      - MYSQL_PASSWORD=Goodie321Strong!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup_database.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
