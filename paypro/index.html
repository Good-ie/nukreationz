<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp"
      crossorigin="anonymous"
    />
    <script src="js/main.js" defer></script>
    <title>Pay</title>
  </head>
  <body>
    <div class="payment-body">
      <h2 style="font-size: 20px; font-weight: 400; margin: 20px;">Payment Details</h2>
      <div class="payment-details">
        <div class="logo">
            <img src="image/NDA Logo 1 3.png" alt="">
        </div>
        <p id="error-message" style="display: none; color: red;">Please fill in all required fields.</p>
        <form action="">
          <input class="form-control" id="amount" type="number" placeholder="Amount" required />
          <select
            class="form-select form-select" id="bank"
            aria-label="Default select example" required
          >
            <option selected>Select Bank</option>
            <option value="1">Access</option>
            <option value="2">GTB</option>
            <option value="3">First Bank</option>
            <option value="2">Kuda</option>
            <option value="3">Sterling</option>
            <option value="2">UBA</option>
            <option value="3">Ecobank Bank</option>
          </select>
          <input
            class="form-control"
            type="number"
            name=""
            id="acct"
            placeholder="Account Number" required
          />
          <button
            type="submit"
            class="pay btn btn-success"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            Pay Now
          </button>
          <div
            class="modal fade pin-modal"
            id="staticBackdrop"
            data-bs-backdrop="static"
            data-bs-keyboard="false"
            tabindex="-1"
            aria-labelledby="staticBackdropLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog  modal-dialog-centered">
              <div class="modal-content">
                <div class="modal-header">
                  <h1 class="modal-title fs-5" id="staticBackdropLabel">
                    Enter Your Bank Transaction Pin
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">
                  <div class="otp-input">
                    <form action="">
                      <input type="password" name="pin" maxlength="1" id="digit1" required />
                      <input type="password" name="pin" maxlength="1" id="digit2" required/>
                      <input type="password" name="pin" maxlength="1" id="digit3" required/>
                      <input type="password" name="pin" maxlength="1" id="digit4" required/><br>
                      <button type="button" class="btn pin">
                        Authorise Payment
                      </button>
                    </form>
                  </div>
                </div>
                
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="hidden loader"></div>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-qKXV1j0HvMUeCBQ+QVp7JcfGl760yU08IQ+GpUo5hlbpg51QRiuqHAJz8+BrxE/N"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </body>
</html>
